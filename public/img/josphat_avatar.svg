<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#cyber-grad)"/>
  <rect width="400" height="400" fill="url(#grid)" opacity="0.6"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#FF3D00" stroke-width="4"/>
  <rect x="30" y="30" width="340" height="340" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Silhouette / Monogram Avatar -->
  <circle cx="200" cy="150" r="60" fill="#181818" stroke="#FF3D00" stroke-width="3"/>
  <path d="M100 330 C100 240, 300 240, 300 330 Z" fill="#181818" stroke="#FF3D00" stroke-width="3"/>
  
  <!-- JKN Monogram overlay -->
  <text x="200" y="165" font-family="monospace" font-size="44" font-weight="900" fill="#F7F7F7" text-anchor="middle" letter-spacing="2">JKN</text>
  
  <!-- Tech Accents -->
  <text x="40" y="360" font-family="monospace" font-size="12" fill="#888" letter-spacing="3">&gt; JOSPHAT_K_NDHLOVU</text>
  <text x="360" y="55" font-family="monospace" font-size="10" fill="#FF3D00" text-anchor="end" letter-spacing="2">[DEV_SYSTEM: ACTIVE]</text>
  <circle cx="45" cy="50" r="4" fill="#39FF14"/>
</svg>
